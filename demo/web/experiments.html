<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TrustSR · Experiments</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..900&family=Space+Grotesk:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/app.css"/><script src="assets/shell.js"></script></head>
<body class="bg-surface font-body-md text-on-surface antialiased" data-page="experiments">
<main id="app" class="min-h-screen">
  <div class="min-h-12 bg-surface-container-high border-b border-outline-variant flex flex-wrap items-center justify-between px-space-md py-space-xs gap-space-sm">
    <div><div class="font-headline-sm text-headline-sm font-bold text-primary">Experiment registry · E1–E8, X2–X9</div>
      <div class="font-label-sm text-label-sm text-on-surface-variant">Each run writes its own JSON with status, evidence type and limitations. A BLOCKED or FAIL is reported as such, not hidden.</div></div>
    <div id="pills" class="flex gap-space-xs"></div>
  </div>
  <div class="flex flex-col xl:flex-row">
    <section class="flex-1 min-w-0">
      <div class="p-space-md bg-surface-container-low border-b border-outline-variant flex items-center gap-space-md">
        <span class="seg" id="flt"><button data-f="ALL" class="on">All</button><button data-f="PASS">Pass</button><button data-f="FAIL">Fail</button><button data-f="BLOCKED">Blocked</button></span>
        <span id="cnt" class="font-label-sm text-label-sm text-on-surface-variant"></span>
      </div>
      <div class="overflow-x-auto"><table class="tbl" id="tbl"></table></div>
    </section>
    <aside class="xl:w-[440px] border-t xl:border-t-0 xl:border-l border-outline-variant bg-surface-container-low">
      <div class="px-space-md py-space-sm bg-surface-container border-b border-outline-variant flex justify-between"><span class="font-label-md text-label-md font-bold text-primary uppercase tracking-wider">Record</span><span id="rid" class="font-label-sm text-label-sm text-secondary"></span></div>
      <div id="rec" class="p-space-md space-y-space-md"></div>
    </aside>
  </div>
</main>
<script>
document.addEventListener('tsr-ready', (ev) => {
  const { esc, int, fix, chip, statusChip } = TSR, s = ev.detail, q = (id) => document.getElementById(id), E = s.experiments;
  const n = (st) => E.filter((e) => e.status === st).length;
  q('pills').innerHTML = chip('ok', '●', 'PASS ' + n('PASS')) + chip('warn', '▲', 'FAIL ' + n('FAIL')) + chip('ref', '■', 'BLOCKED ' + n('BLOCKED'));
  const evid = (e) => e.evidence_parts ? Object.entries(e.evidence_parts).map(([k, v]) => `${k.replace(/_/g, ' ')}: ${v}`).join(' · ') : e.evidence;
  const rule = (e) => {
    const c = e.criteria, k = e.keep_rule;
    if (c && c.rule) return c.rule; if (c && c.keep_4_if) return 'keep 4 transforms if ' + c.keep_4_if;
    if (k && k.per_dataset_beats_bicubic) return 'SR beats bicubic when the PSNR CI lower bound > 0 per dataset';
    if (k && k.conformal_test_far != null) return 'conformal test FAR ≤ α (0.05) and block sums consistent';
    if (c) return Object.entries(c).filter(([, v]) => typeof v !== 'object').slice(0, 2).map(([a, b]) => `${a}: ${b}`).join('; ');
    return e.summary || e.verdict || '—';
  };
  let filter = 'ALL', sel = E[0];
  function draw() {
    const rows = E.filter((e) => filter === 'ALL' || e.status === filter);
    q('cnt').textContent = `SHOWING ${rows.length} OF ${E.length}`;
    q('tbl').innerHTML = '<thead><tr><th>ID</th><th>Keep rule / criterion</th><th>Evidence</th><th>Status</th><th>Run date</th></tr></thead><tbody>' +
      rows.map((e) => `<tr class="click ${e === sel ? 'sel' : ''}" data-id="${e.id}"><td><b>${e.id}</b></td><td style="max-width:420px">${esc(rule(e))}</td><td>${esc(evid(e))}</td><td>${statusChip(e.status)}</td><td>${(e.started_utc || '').slice(0, 10)}</td></tr>`).join('') + '</tbody>';
    q('tbl').querySelectorAll('tr.click').forEach((tr) => tr.addEventListener('click', () => { sel = E.find((e) => e.id === tr.dataset.id); draw(); }));
    rec();
  }
  function rec() {
    const e = sel; q('rid').textContent = e.id + ' · ' + e.file;
    const crit = e.criteria || e.keep_rule;
    q('rec').innerHTML = `<div class="flex items-center justify-between"><span class="font-headline-md text-headline-md">${e.id}</span>${statusChip(e.status)}</div>
      <div class="border border-outline-variant bg-surface-container-lowest p-space-sm font-body-sm text-body-sm"><div class="text-on-surface-variant font-label-sm text-label-sm mb-1">EVIDENCE TYPE</div>${esc(evid(e))}</div>
      ${e.reason ? `<div class="border-l-2 border-secondary pl-space-sm"><div class="font-label-md text-label-md text-secondary font-bold uppercase">Why it did not complete</div><p class="font-body-sm text-body-sm">${esc(e.reason)}</p></div>` : ''}
      ${e.summary || e.verdict ? `<p class="font-body-sm text-body-sm"><b>${esc(e.verdict || '')}</b> ${esc(e.summary || '')}</p>` : ''}
      ${crit ? `<div><div class="font-label-md text-label-md text-primary font-bold uppercase mb-1">Registered criteria</div><pre class="code">${esc(JSON.stringify(crit, null, 1).slice(0, 1400))}</pre></div>` : ''}
      ${e.limitations ? `<div><div class="font-label-md text-label-md text-primary font-bold uppercase mb-1">Limitations (from the run)</div><ul class="list-disc pl-5 space-y-1 font-body-sm text-body-sm">${e.limitations.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>` : ''}
      <p class="font-label-sm text-label-sm text-on-surface-variant">Full record: ${esc(e.file)}</p>`;
  }
  q('flt').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { filter = b.dataset.f; q('flt').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); draw(); }));
  draw();
});
</script>
</body></html>
