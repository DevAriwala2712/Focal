# A2 run details (added before the run; the pre-registered keep rule lives in configs/exceptional.yaml `a2` and is not restated here).
schema_version: 1
preregistration: configs/exceptional.yaml
phase0_config: configs/phase0.yaml
results_dir: experiments/results
cache_dir: data_a2/opensr_test              # gitignored by convention; never committed
byte_cap: 6000000000                        # hard cap on bytes downloaded by this process
hub:
  repo: isp-uv-es/opensr-test
  revision: e4600b9c74a621adeec047e5f6cc7a2d70a58134     # dataset commit inspected 2026-09-30
  version_key: '021'                                     # = opensr_test.load(version="v3") in opensr-test 1.3.3
datasets: [naip, spot, spain_crops, spain_urban, venus]
model_band_order: [B04, B03, B02, B08]
lr_band_index: [3, 2, 1, 7]                 # positions of B04,B03,B02,B08 in the 12-band L2A array (dataset card table)
dn_scale: 10000.0                           # reflectance = DN / 10000 (SEN2SR README; dataset L2A/HRharm means agree, see report)
reference: HRharm                           # primary; HR (unharmonized) is sensitivity only where its radiometry matches (see report)
sensitivity_raw_hr: [naip, spot, venus]
metrics:
  data_range: 1.0
  border_px: 16                             # HR px excluded per side; = opensr-test Config.border_mask default
  clip_unit_interval: true
tiling: {native: 128, scale: 4, margin: 16, stride: 96}     # same as configs/wayanad_evidence.yaml; images < 128 px are reflect-padded
device: auto                                # cuda if available else cpu (mps not used: determinism)
seed: 2024
rerun_check: true
opensr_test:
  enabled: true
  correctness_distance: nd                  # default; clip/lpips would download extra weights
geometry_check: {max_shift_hr_px: 4, pass_fraction: 0.9}
