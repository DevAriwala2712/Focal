schema_version: 1
phase0_config: configs/phase0.yaml
paths:
  results: experiments/results
  cache: data/experiments-cache
seed: 2024
e7:
  run_counts: [8, 32, 96]
  shape: [4, 128, 128]
  ddof: 0
  max_abs_error: 1.0e-6
  ram_growth_tolerance: 1.5
e1:
  tile: 128
  stride: 96
  feather: 32                    # input px; equals the default 128-96 overlap
  aoi_sizes: [128, 300, 517, 1000]
  affine: [10.0, 0.0, 500000.0, 0.0, -10.0, 1300000.0]   # synthetic reference grid, EPSG:32643-like
  # Fixed before any model output was inspected: per-band RMSE of (SR block-mean to 10 m) - input.
  spectral_rmse_tolerance: 0.01
  tolerance_rationale: >-
    0.01 reflectance is about 5% of a 0.2 reflectance target, the order of Sentinel-2 L2A absolute
    radiometric uncertainty. A project choice fixed before measurement, not a published pass mark.
    Per-band max and p99 are reported, alongside a no-model bicubic control.
  real_crop:
    path: data/experiments-cache/real_rgbn_10m.tif       # 4-band B04,B03,B02,B08, 10 m
    dn_scale: null                                       # must be set from the provider asset
    dn_offset: null
ndvi:
  min_denominator: 0.01          # red+nir below this is water/shadow: NDVI undefined -> NaN
e2:
  aoi_px: 517
  offsets: [0, 32]
  hard_cut_feather: 1            # control: near-hard seams
  control_bias: 0.05             # positive control: step per unit of (tile number % period); must exceed the scene's natural gradient (~0.007)
  control_period: 5              # coprime with 6 tiles/row so both horizontal and vertical neighbours differ
  edge_distance_bins: [0, 2, 4, 8, 16, 32, 64]   # raw tile-pair overlap error, input px to the nearer tile edge
  # Fixed before any E2 output was inspected. Twice E1's RMSE tolerance because a max over ~17M
  # values is a harsher statistic than an RMSE.
  interior_max_tolerance: 0.02
  tolerance_rationale: >-
    0.02 reflectance = twice the E1 per-band RMSE tolerance (0.01); project choice fixed before
    measurement. NDVI deltas and seam-zone deltas are reported but are not part of the keep rule.
e3:
  aoi_px: 517
  cpu_runs: 2
  cpu_threads: [1, 4]            # each setting is run in fresh processes; cross-setting equality is a finding
  gpu_runs: 2
e4:
  aoi_px: 1000
  cap_gib: 4.0                   # torch.cuda.set_per_process_memory_fraction; NOT a physical 4 GB GPU
change:
  k: 2.0                         # design default, uncalibrated
  parent_drop_threshold: 0.15    # uncalibrated placeholder for mechanics; calibration is a later decision
e8:
  tiles: 4
  ddof: 1
  min_spearman: 0.95
  min_class_agreement: 0.99
  square: [40, 48, 32, 32]       # synthetic changed square (r0, c0, h, w) in 10 m px
  noise: 0.004
  real_pre:
    path: data/experiments-cache/real_pre_10m.tif      # 4-band B04,B03,B02,B08 at 10 m
    dn_scale: null
    dn_offset: null
  real_post:
    path: data/experiments-cache/real_post_10m.tif     # same grid as real_pre
    dn_scale: null
    dn_offset: null
